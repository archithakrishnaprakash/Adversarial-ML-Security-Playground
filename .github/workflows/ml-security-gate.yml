name: ML Security Gate

# Runs on every push/PR that touches the backend: the normal pytest suite
# first, then the robustness security gate (scripts/security_gate.py), which
# trains a model and fails the job if its robust accuracy under PGD falls
# below the required threshold. This is what turns "we have a robustness
# evaluator" into MLSecOps — a release can be blocked by a robustness
# regression the same way it'd be blocked by a failing test.

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/ml-security-gate.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/ml-security-gate.yml"
  workflow_dispatch:
    inputs:
      dataset:
        description: "Dataset to gate on"
        required: false
        default: "cyber"
      model:
        description: "Model architecture to gate on"
        required: false
        default: "logistic_regression"
      threshold:
        description: "Minimum required robust accuracy (0-1)"
        required: false
        default: "0.70"

jobs:
  test-and-gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: pytest tests/ -v

      - name: ML robustness security gate
        run: |
          python scripts/security_gate.py \
            --dataset "${{ github.event.inputs.dataset || 'cyber' }}" \
            --model "${{ github.event.inputs.model || 'logistic_regression' }}" \
            --attack pgd \
            --epsilon 0.15 \
            --threshold "${{ github.event.inputs.threshold || '0.70' }}"
